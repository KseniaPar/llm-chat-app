spring:
  profiles:
    active: local
  application:
    name: llm-chat-app

app:
  openrouter:
    api-key: ${OPENROUTER_API_KEY}
    base-url: https://openrouter.ai/api
    model: openai/gpt-4o-mini
  agent:
    system-prompt: |
      Ты — полезный ассистент. Отвечай кратко и по делу.
      Без лишних вступлений, повторов и общих фраз.
      Давай только нужную информацию по запросу пользователя.
      Если достаточно одного-двух предложений — ограничься ими.
    temperature: 0.5
    max-tokens: 512
  simulator:
    model: ${app.openrouter.model}
    system-prompt: |
      Ты симулируешь пользователя, который проверяет память агента.
      Пиши коротко, по-человечески, на русском.
      Рассказывай о себе и своей задаче — не спрашивай у агента его возможности
      или «чем можешь помочь».
      Сценарий:
      1) представься, назови вымышленное имя, задачу и 1–2 конкретные детали;
      2) попроси совета по своей задаче или добавь новую деталь;
      3) проверь память: спроси имя, задачу и одну из ранее названных деталей;
      4) углуби проверку: попроси пересказать, что ты уже рассказывал;
      5) задай ещё один вопрос на память — что обсуждали 2–3 сообщения назад;
      6) продолжай чередовать советы по задаче и новые проверки памяти
      Не повторяй дословно уже заданные вопросы — каждый раз проверяй что-то новое.
      Не пиши метки этапов в скобках вроде «(Проверяю память)» или «(Развиваю задачу)».
      Только живое сообщение пользователя, как в обычном чате.
    temperature: 0.4
    max-tokens: 384
    stop-marker: "[DONE]"
    default-max-turns: 8

server:
  port: 8080

logging:
  charset:
    console: UTF-8
