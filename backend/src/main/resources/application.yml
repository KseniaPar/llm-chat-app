spring:
  profiles:
    active: local
  application:
    name: llm-chat-app
  datasource:
    url: jdbc:sqlite:${app.database.path}
    driver-class-name: org.sqlite.JDBC

app:
  database:
    path: data/llm-chat.db
  auth:
    jwt-secret: ${JWT_SECRET:change-me-in-production-use-long-random-string}
    jwt-expiration-ms: 86400000
  openrouter:
    api-key: ${OPENROUTER_API_KEY}
    base-url: https://openrouter.ai/api
    model: openai/gpt-4o-mini
  agent:
    conversation-store-path: data/conversations.json
    system-prompt: |
      Ты — учебный ассистент образовательной платформы.
      Помогаешь разбирать материалы с лекций, делать конспекты и готовиться к экзаменам.
      Отвечай кратко и по делу, с опорой на контекст задачи и память о студенте.
      Если достаточно одного-двух предложений — ограничься ими.
    temperature: 0.5
    max-tokens: 512
    context-window: 128000
    context:
      window-size: 6
    facts:
      update-system-prompt: |
        Ты извлекаешь и обновляешь факты ТЕКУЩЕЙ учебной задачи из диалога.
        Это рабочая память сессии — только то, что относится к сейчас идущему занятию.
        Верни ТОЛЬКО JSON-объект: {"ключ": "значение", ...}
        Ключи на русском, короткие. Используй подходящие из списка или добавь свой:
        предмет, тема, цель, экзамен, дедлайн, материал, источник, раздел,
        что_изучаем, что_уже_разобрали, слабые_места, формат, вопросы_к_экзамену,
        задание, ограничения.
        Не дублируй в facts то, что относится к личности студента навсегда (имя, хобби) —
        это не рабочая память.
        Сохраняй важное из нового сообщения и предыдущих фактов; обновляй устаревшее.
        Без markdown, без пояснений — только JSON.
    memory:
      long-term-extract-prompt: |
        Ты извлекаешь долговременные знания о студенте из диалога.
        Верни ТОЛЬКО JSON: {"profile": {"ключ": "значение"}, "knowledge": {"ключ": "значение"}, "decisions": {"ключ": "значение"}}
        profile — имя, стиль обучения, предпочитаемый формат ответов (кратко/подробно, примеры).
        knowledge — изученные предметы и темы, устойчивые знания между сессиями.
        decisions — договорённости (например, «готовиться по блокам», «начинать с определений»).
        Не сохраняй детали текущего задания (тема лекции, дедлайн экзамена) — это рабочая память.
        Без markdown — только JSON.
    branching:
      default-branch-names:
        - "Ветка A"
        - "Ветка B"
    compression:
      enabled: true
      keep-last-messages: 6
      summarize-every-messages: 10
      summary-system-prompt: |
        Сожми переписку в краткое резюме на русском.
        Сохрани: имена, даты, решения, планы, числа, места.
        Без вступлений — только факты.
    pricing:
      prompt-per-million: 0.15
      completion-per-million: 0.60
  token-demo:
    overflow-turns: 5
    overflow-prompt: prompts/Аристотель . Метафизика.txt
  simulator:
    model: ${app.openrouter.model}
    system-prompt: |
      Ты генерируешь ТОЛЬКО следующее сообщение пользователя в чате на русском.
      Ты — пользователь, не ассистент. Пиши от первого лица («я», «мне», «мой»).
      Никогда не давай советов от лица агента и не обращайся к себе по имени на «ты»
      (не «Алекс, ты можешь…», а «я думаю…», «мне нужно…»).
      Не начинай с «Конечно», «Рекомендую», «Можно попробовать» — это реплики агента.
      Регулярно проверяй память агента невзначай — вплетай имя, задачу, детали из истории.
      Запрещены прямые вопросы: «как меня зовут?», «что я просил?», «перескажи», «помнишь?».
      Без меток в скобках.
    temperature: 0.7
    max-tokens: 256
    stop-marker: "[DONE]"
    default-max-turns: 8

server:
  port: 8080
  tomcat:
    connection-timeout: 2700000

logging:
  charset:
    console: UTF-8
