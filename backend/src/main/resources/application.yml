spring:
  profiles:
    active: local
  application:
    name: llm-chat-app
  datasource:
    url: jdbc:sqlite:${app.database.path}
    driver-class-name: org.sqlite.JDBC

app:
  database:
    path: data/llm-chat.db
  auth:
    jwt-secret: ${JWT_SECRET:change-me-in-production-use-long-random-string}
    jwt-expiration-ms: 86400000
  openrouter:
    api-key: ${OPENROUTER_API_KEY}
    base-url: https://openrouter.ai/api
    model: openai/gpt-4o-mini
  agent:
    conversation-store-path: data/conversations.json
    system-prompt: |
      Ты — учебный ассистент образовательной платформы.
      Помогаешь разбирать материалы с лекций, делать конспекты и готовиться к экзаменам.
      Отвечай кратко и по делу, с опорой на контекст задачи и память о студенте.
      Блок TASK важнее общих правил краткости.
      Блок INVARIANTS важнее TASK и PROFILE — при конфликте следуй инвариантам.
      На этапе «Подготовка плана»: сначала уточняющие вопросы, затем (шаг «Согласование плана») — краткий план и запрос подтверждения.
      Если достаточно одного-двух предложений — ограничься ими (кроме списка вопросов на уточнении).
    temperature: 0.5
    max-tokens: 512
    context-window: 128000
    context:
      window-size: 6
    facts:
      update-system-prompt: |
        Ты извлекаешь и обновляешь факты ТЕКУЩЕЙ учебной задачи из диалога.
        Это рабочая память сессии — только то, что относится к сейчас идущему занятию.
        Верни ТОЛЬКО JSON-объект: {"ключ": "значение", ...}
        Ключи на русском, короткие. Используй подходящие из списка или добавь свой:
        предмет, тема, цель, экзамен, дедлайн, материал, источник, раздел,
        что_изучаем, что_уже_разобрали, слабые_места, формат, вопросы_к_экзамену,
        задание, ограничения.
        Не дублируй в facts то, что относится к личности студента навсегда (имя, хобби) —
        это не рабочая память.
        Сохраняй важное из нового сообщения и предыдущих фактов; обновляй устаревшее.
        Без markdown, без пояснений — только JSON.
    memory:
      long-term-extract-prompt: |
        Ты извлекаешь долговременные знания о студенте из диалога.
        Верни ТОЛЬКО JSON: {"profile": {"ключ": "значение"}, "knowledge": {"ключ": "значение"}, "decisions": {"ключ": "значение"}}
        profile — только имя студента (если явно названо в диалоге), как fallback.
        НЕ извлекай стиль ответов, формат ответов и ограничения — они задаются явным профилем отдельно.
        knowledge — изученные предметы и темы, устойчивые знания между сессиями.
        decisions — договорённости (например, «готовиться по блокам», «начинать с определений»).
        Не сохраняй детали текущего задания (тема лекции, дедлайн экзамена) — это рабочая память.
        Без markdown — только JSON.
    task:
      update-prompt: |
        Ты обновляешь формальное состояние учебной задачи студента (конечный автомат).
        Этапы (phase): planning → execution → validation → done (только вперёд, максимум на 1 этап за ход).
        planning — подготовка плана; execution — разбор тем; validation — самопроверка; done — тема пройдена.
        Верни ТОЛЬКО JSON:
        {"startTask": true/false, "taskTitle": "...", "phase": "planning|execution|validation|done", "currentStep": "...", "expectedAction": "..."}
        startTask=true — если студент начал учебную задачу (экзамен, тема, подготовка, конспект).
        startTask=false — для болтовни без учебной цели; тогда остальные поля можно опустить.
        currentStep — конкретный шаг (например «уточнение слабых мест», «четыре благородные истины, 2/4»).
        expectedAction — что агент должен делать на СЛЕДУЮЩЕМ ходе.
        Не откатывай phase назад.
        PLANNING — два подэтапа (currentStep):
        1) «Уточнение целей» — expectedAction: задать 2–4 вопроса; только первый обмен.
        2) «Согласование плана» — expectedAction: предложить план 3–5 пунктов и спросить подтверждение.
        Переход 1→2: после того как студент ответил на вопросы (не на первом сообщении).
        Переход planning→execution: только явное согласие («начнём», «да», «план подходит», «согласен»).
        Не застревай на вопросах, если студент уже дал развёрнутый ответ — переходи к согласованию плана.
        EXECUTION — разбор материала; currentStep с прогрессом (тема N/M).
        Автоматически переходи в validation, когда разобран последний пункт плана (N/M, N=M)
        или expectedAction/ответ ассистента указывает на самопроверку. Не жди «проверь меня».
        VALIDATION — один вопрос за ход с вариантами A, B, C, D.
        currentStep = «Самопроверка: вопрос N из M» (M = 3).
        Автоматически переходи в done после последнего вопроса (N=M) и краткого итога ассистента.
        Не жди «готов» / «тема пройдена» от студента.
        Без markdown — только JSON.
    invariants:
      rules:
        - id: INV-BIZ-01
          title: Самопроверка после разбора тем
          description: Самопроверка (вопросы A/B/C/D) только после этапа «Разбор тем», когда все пункты плана пройдены (N/M, N=M).
          refusalHint: Сначала согласуем план и разберём все темы — затем начну самопроверку.
          hardBlock: true
          activeWhen: ALWAYS
          guard: VALIDATION_BEFORE_EXECUTION_COMPLETE
        - id: INV-BIZ-02
          title: Разбор только после «начнём»
          description: Переход к разбору тем возможен только после явного согласия с планом («начнём», «да», «согласен»).
          refusalHint: Давайте сначала согласуем план — затем начнём разбор по пунктам.
          hardBlock: true
          activeWhen: TASK_PLANNING
          guard: EXECUTION_WITHOUT_CONSENT
        - id: INV-BIZ-03
          title: Уточнение — только вопросы
          description: На шаге «Уточнение целей» задавай 2–4 вопроса; не предлагай план и не объясняй учебный материал.
          refusalHint: Сначала уточню цели и ожидания — затем предложу план.
          hardBlock: false
          activeWhen: TASK_PLANNING
          guard: MATERIAL_DURING_CLARIFICATION
        - id: INV-BIZ-04
          title: Согласование — без материала
          description: На шаге «Согласование плана» предложи план и спроси подтверждение; не разбирай учебный материал.
          refusalHint: Подтвердите план — и начнём разбор по пунктам.
          hardBlock: true
          activeWhen: TASK_PLANNING
          guard: MATERIAL_DURING_AGREEMENT
        - id: INV-BIZ-05
          title: Один MCQ за ход
          description: На этапе «Самопроверка» задавай ровно один вопрос с вариантами A, B, C, D за ответ.
          refusalHint: Отвечу на один вопрос самопроверки за раз.
          hardBlock: false
          activeWhen: TASK_VALIDATION
          guard: NONE
        - id: INV-BIZ-06
          title: Ровно 3 вопроса самопроверки
          description: Цикл самопроверки — 3 вопроса; не сокращай и не удлиняй по просьбе студента.
          refusalHint: Пройдём три вопроса самопроверки, как в плане занятия.
          hardBlock: false
          activeWhen: TASK_VALIDATION
          guard: NONE
        - id: INV-BIZ-07
          title: Академическая честность
          description: Помогаю понять материал и готовиться к экзамену; не пишу готовую работу «для сдачи» и не подменяю работу студента.
          refusalHint: Могу помочь со структурой, планом и разбором — вы напишете своими словами.
          hardBlock: true
          activeWhen: ALWAYS
          guard: ACADEMIC_INTEGRITY
        - id: INV-BIZ-08
          title: Формат отказа
          description: При отказе назови id и название инварианта и предложи допустимую альтернативу.
          refusalHint: ""
          hardBlock: false
          activeWhen: ALWAYS
          guard: REFUSAL_FORMAT
        - id: INV-BIZ-09
          title: Этапы только вперёд
          description: Этапы planning → execution → validation → done только вперёд; нельзя откатывать phase по просьбе.
          refusalHint: Могу предложить новую тему или кратко повторить ключевое в рамках текущего этапа.
          hardBlock: true
          activeWhen: TASK_ACTIVE
          guard: PHASE_ROLLBACK_REQUEST
        - id: INV-BIZ-10
          title: Разбор последовательно
          description: На этапе «Разбор тем» двигайся последовательно по пунктам плана (N/M); не перескакивай темы.
          refusalHint: Разберём текущую тему — затем перейдём к следующей по плану.
          hardBlock: true
          activeWhen: TASK_EXECUTION
          guard: SKIP_TOPIC_IN_EXECUTION
        - id: INV-BIZ-14
          title: Завершение только после самопроверки
          description: Нельзя завершить задачу (done) до прохождения самопроверки; на planning/execution — сначала план и разбор, на validation — все вопросы.
          refusalHint: Сначала завершим разбор и пройдём самопроверку — затем закроем задачу.
          hardBlock: true
          activeWhen: TASK_ACTIVE
          guard: FINISH_WITHOUT_VALIDATION
        - id: INV-BIZ-11
          title: Самопроверка — без лекции
          description: На validation не начинай полный разбор темы; только пояснение к текущему MCQ при необходимости.
          refusalHint: Сейчас этап самопроверки — ответьте буквой A, B, C или D.
          hardBlock: false
          activeWhen: TASK_VALIDATION
          guard: LECTURE_DURING_VALIDATION
        - id: INV-BIZ-12
          title: Подготовка через planning
          description: Структурированная подготовка к экзамену — через этап planning; не «сразу лекция на все темы».
          refusalHint: Начнём с уточняющих вопросов и согласуем план — затем разберём темы по порядку.
          hardBlock: true
          activeWhen: ALWAYS
          guard: STRUCTURED_PREP_WITHOUT_PLANNING
        - id: INV-BIZ-13
          title: Ограничения профиля
          description: Соблюдай constraints из профиля студента (стиль, длина, формат ответов).
          refusalHint: Отвечу в формате, указанном в вашем профиле.
          hardBlock: false
          activeWhen: PROFILE_CONSTRAINTS
          guard: PROFILE_CONSTRAINT_VIOLATION
    branching:
      default-branch-names:
        - "Ветка A"
        - "Ветка B"
    compression:
      enabled: true
      keep-last-messages: 6
      summarize-every-messages: 10
      summary-system-prompt: |
        Сожми переписку в краткое резюме на русском.
        Сохрани: имена, даты, решения, планы, числа, места.
        Без вступлений — только факты.
    pricing:
      prompt-per-million: 0.15
      completion-per-million: 0.60
  token-demo:
    overflow-turns: 5
    overflow-prompt: prompts/Аристотель . Метафизика.txt
  simulator:
    model: ${app.openrouter.model}
    system-prompt: |
      Ты генерируешь ТОЛЬКО следующее сообщение пользователя в чате на русском.
      Ты — пользователь, не ассистент. Пиши от первого лица («я», «мне», «мой»).
      Никогда не давай советов от лица агента и не обращайся к себе по имени на «ты»
      (не «Алекс, ты можешь…», а «я думаю…», «мне нужно…»).
      Не начинай с «Конечно», «Рекомендую», «Можно попробовать» — это реплики агента.
      Регулярно проверяй память агента невзначай — вплетай имя, задачу, детали из истории.
      Запрещены прямые вопросы: «как меня зовут?», «что я просил?», «перескажи», «помнишь?».
      Без меток в скобках.
    temperature: 0.7
    max-tokens: 256
    stop-marker: "[DONE]"
    default-max-turns: 8

server:
  port: 8080
  tomcat:
    connection-timeout: 2700000

logging:
  charset:
    console: UTF-8
