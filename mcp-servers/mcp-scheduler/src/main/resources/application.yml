spring:
  main:
    web-application-type: none
    banner-mode: off
    log-startup-info: false
  datasource:
    url: jdbc:sqlite:${scheduler.db.path:data/scheduler.db}
    driver-class-name: org.sqlite.JDBC
  ai:
    mcp:
      server:
        name: mcp-scheduler
        stdio: true

scheduler:
  db:
    path: ${SCHEDULER_DB_PATH:data/scheduler.db}

logging:
  level:
    root: WARN
