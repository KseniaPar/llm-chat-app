server {
    listen 80;
    listen [::]:80;
    server_name NGINX_SERVER_NAME_PLACEHOLDER;

    SITE_AUTH_PLACEHOLDER

    client_max_body_size 512k;

    root APP_ROOT_PLACEHOLDER/frontend/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Публично доступен только чат Day 30; остальные API закрыты.
    location = /api/local-llm/service/info {
        limit_req zone=llm_chat burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include APP_ROOT_PLACEHOLDER/deploy/vps/nginx-proxy-params.conf;
    }

    location = /api/local-llm/service/chat {
        limit_req zone=llm_chat burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include APP_ROOT_PLACEHOLDER/deploy/vps/nginx-proxy-params.conf;
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/llm-chat-access.log;
    error_log /var/log/nginx/llm-chat-error.log;
}
