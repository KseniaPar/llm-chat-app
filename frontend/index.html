<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>День 29 — Оптимизация локальной LLM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/rag.css">
</head>
<body>
  <main class="rag-app rag-app--local-llm">
    <header class="rag-app__header">
      <span class="rag-app__badge">Day 29</span>
      <h1 class="rag-app__title">Оптимизация локальной LLM</h1>
      <p class="rag-app__desc" id="demo-description">
        Сравнение базовой и оптимизированной конфигурации Ollama для RAG-ассистента.
      </p>
    </header>

    <section class="rag-panel">
      <h2 class="rag-panel__title">Профили</h2>
      <div class="local-llm-status">
        <span id="status-dot" class="status-dot status-dot--offline" aria-hidden="true"></span>
        <div>
          <p id="status-message" class="local-llm-status__message">Загрузка…</p>
          <p id="baseline-meta" class="local-llm-status__meta"></p>
          <p id="optimized-meta" class="local-llm-status__meta"></p>
        </div>
      </div>
      <p id="use-case" class="rag-panel__hint"></p>
      <p id="index-status" class="rag-panel__hint"></p>
    </section>

    <section class="rag-panel">
      <h2 class="rag-panel__title">Сценарий сравнения</h2>
      <p class="rag-panel__hint">
        4 шага: простой → средний → сложный → off-topic.
        На CPU ~3–4 мин на шаг (~15 мин на весь сценарий).
      </p>
      <div id="last-run-banner" class="modes-compare__summary hidden"></div>
      <div class="rag-panel__actions local-llm-actions">
        <button id="demo-run-all-btn" class="rag-panel__btn rag-panel__btn--primary" type="button">
          Запустить весь сценарий (в фоне)
        </button>
      </div>
      <div id="demo-scenarios" class="local-llm-scenarios"></div>
      <div id="demo-summary" class="modes-compare__summary hidden"></div>
      <p id="demo-status" class="rag-panel__hint"></p>
    </section>

    <section class="rag-panel">
      <label class="rag-panel__label">
        Вопрос по корпусу «Основы православия»
        <textarea id="question-input" class="rag-panel__input" rows="3"
          placeholder="Например: Перечислите семь Таинств Православной Церкви…"></textarea>
      </label>
      <div class="rag-panel__actions">
        <button id="compare-btn" class="rag-panel__btn rag-panel__btn--primary" type="button">
          Сравнить BASELINE vs OPTIMIZED
        </button>
      </div>
      <p id="query-status" class="rag-panel__hint"></p>
    </section>

    <section id="compare-section" class="rag-panel hidden">
      <h2 class="rag-panel__title">Результат сравнения</h2>
      <div id="compare-stats" class="compare-table-wrap"></div>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
