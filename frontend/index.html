<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>День 26 — Локальная LLM (Ollama)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/rag.css">
</head>
<body>
  <main class="rag-app rag-app--local-llm">
    <header class="rag-app__header">
      <p class="rag-app__badge">Day 26</p>
      <h1 class="rag-app__title">Локальная LLM (Ollama)</h1>
      <p id="demo-description" class="rag-app__desc">Проверка CLI и HTTP API · запросы разной сложности</p>
    </header>

    <section class="demo-card local-llm-status-card">
      <h2 class="demo-card__title">Статус Ollama</h2>
      <div class="local-llm-status">
        <span id="status-indicator" class="status-dot status-dot--offline" aria-hidden="true"></span>
        <div>
          <p id="status-message" class="local-llm-status__message">Проверка…</p>
          <p id="status-meta" class="local-llm-status__meta"></p>
        </div>
        <button id="status-refresh-btn" class="rag-panel__btn" type="button">Обновить</button>
      </div>
    </section>

    <section class="demo-card">
      <h2 class="demo-card__title">Произвольный запрос</h2>
      <form id="custom-chat-form" class="chat-input-form">
        <textarea id="custom-prompt" class="chat-input" rows="3" placeholder="Введите prompt для локальной модели…"></textarea>
        <button id="custom-send-btn" class="rag-panel__btn rag-panel__btn--primary" type="submit">Отправить в Ollama</button>
      </form>
      <div id="custom-result" class="local-llm-result" hidden></div>
    </section>

    <section class="demo-card demo-card--actions">
      <h2 id="scenarios-title" class="demo-card__title">Тестовые запросы</h2>
      <div class="local-llm-actions">
        <button id="run-all-btn" class="rag-panel__btn rag-panel__btn--primary" type="button">Запустить все</button>
      </div>
      <div id="scenarios-list" class="local-llm-scenarios"></div>
    </section>

    <p id="local-llm-status" class="demo-status" aria-live="polite"></p>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
