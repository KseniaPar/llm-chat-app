<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>День 8 — Работа с токенами</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="app">
    <div class="app__top">
    <section class="chat-shell">
      <header class="chat-header">
        <div class="chat-header__top">
          <div class="chat-header__avatar" aria-hidden="true">AI</div>
          <div class="chat-header__info">
            <h1>Агент</h1>
            <p>День 8 — подсчёт токенов и влияние контекста на стоимость</p>
          </div>
          <span id="loading" class="chat-header__status hidden" aria-live="polite">
            <span class="typing-dots"><span></span><span></span><span></span></span>
            печатает
          </span>
          <button id="new-dialog-btn" class="chat-header__action" type="button" title="Очистить чат и начать заново">Новый диалог</button>
        </div>
        <div class="chat-header__scenarios">
          <button id="scenario-short-btn" class="chat-header__action" type="button" title="4 вызова API">Маленький диалог</button>
          <button id="scenario-long-btn" class="chat-header__action" type="button" title="20 вызовов API — показывает рост истории и токенов">Большой диалог</button>
          <button id="scenario-overflow-btn" class="chat-header__action" type="button" title="5 вызовов — фрагменты длинного текста, переполнение на последнем">Переполнение</button>
        </div>
      </header>

      <div id="messages" class="messages" aria-live="polite">
        <div class="messages-empty">
          <div class="messages-empty__icon" aria-hidden="true">💬</div>
          <p>Начните диалог или выберите сценарий сверху</p>
        </div>
      </div>

      <div id="error" class="error hidden" role="alert"></div>

      <footer class="composer">
        <textarea
          id="prompt"
          class="composer__input"
          rows="1"
          placeholder="Напишите сообщение..."
        ></textarea>
        <button id="send-btn" class="composer__send" type="button" aria-label="Отправить">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 2 11 13"></path>
            <path d="M22 2 15 22 11 13 2 9 22 2"></path>
          </svg>
        </button>
      </footer>
    </section>

    <aside id="stats-panel" class="stats-panel hidden" aria-live="polite">
      <h2 class="stats-panel__title">Статистика</h2>
      <div class="token-panel__grid token-panel__grid--sidebar">
        <div class="token-stat">
          <span class="token-stat__label">Текущий запрос</span>
          <span id="token-current" class="token-stat__value">—</span>
        </div>
        <div class="token-stat">
          <span class="token-stat__label">История</span>
          <span id="token-history" class="token-stat__value">—</span>
        </div>
        <div class="token-stat">
          <span class="token-stat__label">Ответ модели</span>
          <span id="token-response" class="token-stat__value">—</span>
        </div>
        <div class="token-stat">
          <span class="token-stat__label">Сессия</span>
          <span id="token-session" class="token-stat__value">—</span>
        </div>
        <div class="token-stat token-stat--wide">
          <span class="token-stat__label">Стоимость сессии</span>
          <span id="token-cost" class="token-stat__value">—</span>
        </div>
        <div class="token-stat token-stat--wide">
          <span class="token-stat__label">Окно контекста</span>
          <span id="token-context" class="token-stat__value">—</span>
        </div>
      </div>
      <div id="token-bar" class="token-bar hidden">
        <div id="token-bar-fill" class="token-bar__fill"></div>
      </div>
      <p id="token-warning" class="token-panel__warning hidden"></p>
    </aside>
    </div>

    <section id="scenario-table-panel" class="scenario-table-panel hidden" aria-live="polite">
      <h2 class="scenario-table-panel__title">Шаги сценария</h2>
      <div id="scenario-table" class="scenario-table-panel__table"></div>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
