<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Chat Demo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>LLM Chat Demo</h1>
      <p class="subtitle">OpenRouter + Spring Boot</p>
    </header>

    <section class="chat-card">
      <label for="prompt" class="label">Ваш промпт</label>
      <textarea
        id="prompt"
        class="prompt-input"
        rows="4"
        placeholder="Например: Расскажи короткий факт о Java..."
      ></textarea>

      <div class="actions">
        <button id="send-btn" class="send-btn" type="button">Отправить</button>
        <span id="loading" class="loading hidden" aria-live="polite">Думаю...</span>
      </div>

      <div id="error" class="error hidden" role="alert"></div>

      <div class="logs-section">
        <h2 class="response-title">Логи</h2>
        <div id="logs" class="logs-box">Логи запроса появятся здесь.</div>
      </div>

      <div class="response-section">
        <h2 class="response-title">Ответ</h2>
        <div id="response" class="response-box">Ответ появится здесь после отправки промпта.</div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
