<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вопросы о православной вере</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/ai-server.css">
</head>
<body>
  <div class="ai-server">
    <header class="ai-server__header">
      <div class="ai-server__brand">
        <div class="ai-server__mark" aria-hidden="true"></div>
        <div>
          <h1 class="ai-server__title">Вопросы о православной вере</h1>
          <p id="model-label" class="ai-server__tagline">учебный собеседник · локально</p>
        </div>
      </div>
      <div class="ai-server__actions">
        <span id="status-pill" class="ai-server__pill ai-server__pill--offline">недоступен</span>
        <button id="new-chat-btn" class="ai-server__btn" type="button">Новый разговор</button>
      </div>
    </header>

    <main id="messages" class="ai-server__messages" aria-live="polite"></main>

    <footer class="ai-server__footer">
      <p class="ai-server__disclaimer">
        Учебный локальный собеседник. Не является священнослужителем и не заменяет
        Таинства Церкви. По личным духовным вопросам обращайтесь к священнику вашего прихода.
      </p>
      <p id="error" class="ai-server__error hidden" role="alert"></p>
      <form id="chat-form" class="ai-server__composer">
        <textarea
          id="prompt"
          class="ai-server__input"
          rows="1"
          placeholder="Короткий вопрос о вере…"
          autocomplete="off"
        ></textarea>
        <button id="send-btn" class="ai-server__send" type="submit" aria-label="Отправить">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2 11 13M22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
      <p id="meta" class="ai-server__meta"></p>
    </footer>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
