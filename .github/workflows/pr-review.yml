name: AI PR Review (Day 32)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI code review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect PR diff and changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed-files.txt || true
          git diff "${BASE_SHA}...${HEAD_SHA}" > pr.diff
          echo "Changed files:"
          cat changed-files.txt || true
          wc -c pr.diff changed-files.txt

      - name: Run AI reviewer
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::Secret OPENROUTER_API_KEY is not set. Add it in repo Settings → Secrets."
            exit 1
          fi
          node scripts/pr-review.mjs \
            --diff pr.diff \
            --files changed-files.txt \
            --title "${{ github.event.pull_request.title }}" \
            --base "${{ github.event.pull_request.base.ref }}" \
            --head "${{ github.event.pull_request.head.ref }}" \
            --out review.md

      - name: Find previous AI review comment
        if: success()
        id: find_comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- llm-chat-app day32 ai-review -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            core.setOutput('comment-id', existing ? String(existing.id) : '');

      - name: Publish review comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            const commentId = '${{ steps.find_comment.outputs.comment-id }}';
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: Number(commentId),
                body,
              });
              core.info('Updated existing AI review comment ' + commentId);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created new AI review comment');
            }

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-pr-review
          path: |
            review.md
            pr.diff
            changed-files.txt
          if-no-files-found: ignore
